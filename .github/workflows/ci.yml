name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: bachatbuddy
          POSTGRES_PASSWORD: bachatbuddy
          POSTGRES_DB: bachatbuddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bachatbuddy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://bachatbuddy:bachatbuddy@localhost:5432/bachatbuddy_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: test-jwt-secret
      BCRYPT_COST: "4"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: backend
      - run: bundle exec rails db:prepare
      - run: bundle exec rspec
      - run: bundle exec brakeman -q -w2 || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
